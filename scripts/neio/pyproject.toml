[project]
name = "neio-study"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.11.0",
    "warp-lang==1.17.0",
    "mujoco==3.12.0",
    "mujoco-warp==3.12.0",
    "newton-usd-schemas==0.5.0",
    "numpy==2.5.1",
    "scipy==1.18.1",
    "usd-core==26.8",
    "trimesh==5.2.2",
    "pytest==9.2.0",
    "wandb==0.26.1",
    "pycollada==0.9.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = []

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
