workflow:
  name: isaac-lab
  resources:
    default:
      gpu: {{ num_gpu }}
      cpu: {{ num_cpu }}
      memory: {{ memory }}Gi
      storage: {{ storage }}Gi
      platform: {{ platform }}

  groups:
  - name: training
    tasks:
    {% for item in range(num_node) %}
    {% if item == 0 %}
    - name: master
      lead: true
      outputs:
      - dataset:
          name: {{ dataset }}
          path: model
    {% else %}
    - name: worker_{{item}}
    {% endif %}
      image: nvcr.io/nvidian/octi-isaac-lab:{{ image }}
      command: ["bash"]
      args: ["/tmp/run.sh"]
      environment:
        ACCEPT_EULA: Y
        NO_NUCLEUS: Y
        NCCL_DEBUG: WARN
        NCCL_ASYNC_ERROR_HANDLING: "1"
        TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
      credentials:
        wandb:
          WANDB_USERNAME: wandb_username
          WANDB_API_KEY: wandb_api_key
      files:
      - path: /tmp/run.sh
        contents: |
          set -euo pipefail
          mkdir -p {{output}}/model

          # Avoid Vulkan conflicts in Isaac containers
          if [ -e "/usr/share/vulkan" ] && [ -e "/etc/vulkan" ]; then
            mv /usr/share/vulkan /usr/share/vulkan_hidden
          fi

          export WANDB_API_KEY="${WANDB_API_KEY}"
          export WANDB_USERNAME=nvidia
          export OMP_NUM_THREADS=$(( {{ num_cpu }} / {{ num_gpu }} ))
          if [ "${OMP_NUM_THREADS}" -lt 1 ]; then
            export OMP_NUM_THREADS=1
          fi
          export MKL_NUM_THREADS="${OMP_NUM_THREADS}"
          export OPENBLAS_NUM_THREADS="${OMP_NUM_THREADS}"

          {% if num_node > 1 %}
          /workspace/isaaclab/_isaac_sim/python.sh -m torch.distributed.run \
            --nnodes {{ num_node }} \
            --nproc_per_node {{ num_gpu }} \
            --node_rank {{ item }} \
            --master_addr {{host:master}} \
            --master_port {{ master_port }} \
            /workspace/isaaclab/{{ script }} \
              --distributed \
              --workflow_id {{workflow_id}} \
              {{ args }}
          {% elif num_gpu > 1 %}
          /workspace/isaaclab/_isaac_sim/python.sh -m torch.distributed.run \
            --nnodes 1 \
            --nproc_per_node {{ num_gpu }} \
            --master_addr 127.0.0.1 \
            --master_port {{ master_port }} \
            /workspace/isaaclab/{{ script }} \
              --distributed \
              --workflow_id {{workflow_id}} \
              {{ args }}
          {% else %}
          /workspace/isaaclab/_isaac_sim/python.sh \
            /workspace/isaaclab/{{ script }} \
              --workflow_id {{workflow_id}} \
              {{ args }}
          {% endif %}

          # Collect logs/checkpoints into the dataset output dir
          shopt -s nullglob
          mv logs/* {{output}}/model/ 2>/dev/null || true

      - path: /tmp/config.json
        contents: |
          {
            "launch_config": {
              "headless": true
            }
          }
    {% endfor %}

default-values:
  image: factory
  num_node: 1
  num_gpu: 1
  master_port: 29400
  num_cpu: 16
  memory: 64
  storage: 256
  platform: dgx-h100
  dataset: isaac-lab-ppo-model
  script: scripts/reinforcement_learning/rsl_rl/train.py
  args:
